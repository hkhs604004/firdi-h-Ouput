<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0d0f14;
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 127, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(41, 224, 164, 0.1) 0px, transparent 50%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(20, 23, 32, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(79, 127, 255, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .gradient-text {
            background: linear-gradient(135deg, #4f7fff 0%, #29e0a4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="text-slate-200 font-sans antialiased">
    <div class="max-w-6xl mx-auto px-6 py-20">
        <!-- Header -->
        <header class="text-center mb-16">
            <div class="inline-block p-3 bg-blue-500/10 rounded-2xl mb-6 border border-blue-500/20">

            </div>

                <div class="w-14 h-14 bg-blue-500/10 rounded-2xl flex items-center justify-center mb-6 border border-blue-500/20 group-hover:bg-blue-500/20 transition-colors">
                    <i class="fa-solid fa-chart-pie text-2xl text-blue-500"></i>
                </div>
                <h3 class="text-xl font-bold mb-3">月度經營 KPI 儀表</h3>

                    整合營收、良率與客訴數據，內建 Gemini AI 自動化洞察與對話助手。
                </p>
                <div class="flex items-center text-blue-400 font-bold text-sm">
                    進入系統 <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                </div>
            </a>

            <!-- Sales War Room -->
            <a href="SalesWarRoom_2026.html" class="glass-card rounded-3xl p-8 flex flex-col group">
                <div class="w-14 h-14 bg-emerald-500/10 rounded-2xl flex items-center justify-center mb-6 border border-emerald-500/20 group-hover:bg-emerald-500/20 transition-colors">
                    <i class="fa-solid fa-money-bill-trend-up text-2xl text-emerald-500"></i>
                </div>
                <h3 class="text-xl font-bold mb-3">新品上市業務追蹤</h3>
                <p class="text-slate-400 text-sm mb-6 flex-grow">
                    2026 年度銷售戰情室，即時監控業務達標率、銷售趨勢與熱圖分析。
                </p>
                <div class="flex items-center text-emerald-400 font-bold text-sm">

            </a>

                <div class="w-14 h-14 bg-violet-500/10 rounded-2xl flex items-center justify-center mb-6 border border-violet-500/20 group-hover:bg-violet-500/20 transition-colors">
                    <i class="fa-solid fa-users-gear text-2xl text-violet-500"></i>
                </div>
                <h3 class="text-xl font-bold mb-3">人力產值 AI 診斷</h3>
                <p class="text-slate-400 text-sm mb-6 flex-grow">
                    製造部門人力配置合理性分析，提供加班效率預測與過勞異常警報。

            <div class="flex gap-6">

</html>
